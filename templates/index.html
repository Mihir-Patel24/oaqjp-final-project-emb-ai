<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector - Watson NLP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 700px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }
        h1 { font-size: 2rem; margin-bottom: 8px; color: #e94560; }
        p.subtitle { color: #aaa; margin-bottom: 28px; }
        label { display: block; margin-bottom: 8px; color: #ccc; font-size: 0.9rem; }
        textarea {
            width: 100%; padding: 14px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08); color: #fff;
            font-size: 1rem; resize: vertical; min-height: 100px; outline: none;
        }
        textarea:focus { border-color: #e94560; }
        button {
            margin-top: 14px; padding: 13px 28px;
            background: #e94560; color: #fff; border: none;
            border-radius: 8px; font-size: 1rem; cursor: pointer;
            width: 100%; transition: background 0.3s;
        }
        button:hover { background: #c73652; }
        #output {
            margin-top: 22px; padding: 18px;
            background: rgba(255,255,255,0.07);
            border-radius: 10px; border-left: 4px solid #e94560;
            font-size: 0.97rem; line-height: 1.6; display: none;
        }
        #output b { color: #e94560; }
    </style>
</head>
<body>
    <div class="container">
        <h1>&#127775; Emotion Detector</h1>
        <p class="subtitle">Powered by IBM Watson NLP</p>
        <label for="textToAnalyze">Enter text to analyze:</label>
        <textarea id="textToAnalyze" placeholder="e.g. I am so happy today!"></textarea>
        <button onclick="sendForAnalysis()">Detect Emotions</button>
        <div id="output"></div>
    </div>
    <script>
        function sendForAnalysis() {
            var text = document.getElementById("textToAnalyze").value;
            var outputDiv = document.getElementById("output");
            outputDiv.style.display = "block";
            outputDiv.innerHTML = "Analyzing...";
            var xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    outputDiv.innerHTML = this.responseText;
                }
            };
            xhttp.open("GET", "/emotionDetector?textToAnalyze=" + encodeURIComponent(text), true);
            xhttp.send();
        }
    </script>
</body>
</html>
